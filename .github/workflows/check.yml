name: Validate extensions

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Extension checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install checksum-pinned Amp CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amp-bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://static.ampcode.com/cli/0.0.1792872041-gb83e0b/amp-linux-x64.gz \
            | gzip -dc > "$RUNNER_TEMP/amp-bin/amp"
          echo "7f100a5f8654de73c13d7a8c283fc4b41deefd1163de172ef0e163bc92dce13c  $RUNNER_TEMP/amp-bin/amp" | sha256sum --check
          chmod +x "$RUNNER_TEMP/amp-bin/amp"
          echo "$RUNNER_TEMP/amp-bin" >> "$GITHUB_PATH"

      - name: Run repository checks without credentials
        run: make check
